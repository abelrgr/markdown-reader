[package]
name = "markdown-reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "markdown_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
thiserror = "2.0.21"
encoding_rs = "0.8.35"
dunce = "1.0.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-store = "2.4.5"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-fs = { version = "2.5.2", features = ["watch"] }
ignore = "0.4.30"
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["macros"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wiremock = "0.6.5"
